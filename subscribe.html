<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Subscribe to Eco Store updates.">
    <title>Subscribe | Eco Store</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/footer.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/utility-pages.css">
</head>

<body>
    <header class="eco-header">
        <div class="header-container">
            <div class="logo">
                <a href="index.html" class="logo-link" aria-label="Eco Store Home">
                    <span class="logo-icon">🍃</span>
                    <span class="logo-text">Eco Store</span>
                </a>
            </div>
            <nav class="main-nav">
                <button class="mobile-menu-toggle" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Shop</a></li>
                    <li><a href="about.html">About Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="content-wrap narrow">
        <h1>Subscribe to Eco Store</h1>
        <p>Get sustainability tips, product updates, and seasonal offers.</p>

        <form action="#" method="post" class="subscribe-form">
            <label for="subscriberName">Name</label>
            <input id="subscriberName" name="name" type="text" placeholder="Your name" required>

            <label for="subscriberEmail">Email</label>
            <input id="subscriberEmail" name="email" type="email" placeholder="you@example.com" required>

            <button class="btn" type="submit">Subscribe</button>
        </form>

        <p class="back-link"><a href="about.html">Back to About</a></p>
    </main>

    <footer class="eco-footer">
        <div class="footer-container">
            <div class="footer-section logo-section">
                <a href="index.html" class="logo-link" aria-label="Eco Store Home">
                    <span class="logo-icon">🍃</span>
                    <span class="logo-text">Eco Store</span>
                </a>
                <p>Your trusted source for sustainable products.</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2024 Eco Store. All Rights Reserved. | <a href="privacy-policy.html">Privacy Policy</a></p>
        </div>
    </footer>

    <script src="script/footer.js"></script>

</body>

</html>
